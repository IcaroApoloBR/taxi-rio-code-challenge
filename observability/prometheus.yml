global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
