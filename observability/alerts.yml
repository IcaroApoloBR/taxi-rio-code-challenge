groups:
  - name: corridas-service
    rules:
      - alert: ApiTargetDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API de corridas indisponível"
          description: "Prometheus não consegue coletar métricas da API há mais de 2 minutos."

      - alert: WorkerTargetDown
        expr: up{job="worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker de corridas indisponível"
          description: "Prometheus não consegue coletar métricas do Worker há mais de 2 minutos."

      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(http_request_errors_total[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05
          and
          sum(increase(http_requests_total[5m])) > 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro da API acima de 5%"
          description: "Mais de 5% das respostas foram 5xx durante 5 minutos, com pelo menos 20 requisições no período."

      - alert: CorridasQueueBacklog
        expr: |
          sum(rabbitmq_queue_messages_ready{queue=~"corridas.history|corridas.status-cache"}) > 100
          or
          (
            time() - rabbitmq_queue_head_message_timestamp{queue=~"corridas.history|corridas.status-cache"} > 60
          )
          or
          corridas_oldest_message_age_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fila de corridas acumulada"
          description: "Há mais de 100 mensagens prontas nas filas de corrida, a mensagem do topo passou de 60 segundos, ou o outbox tem um evento sem publicar há mais de 60 segundos."
