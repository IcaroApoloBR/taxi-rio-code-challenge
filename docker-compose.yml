name: taxi-rio-local

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-corridas}
      MYSQL_USER: ${MYSQL_USER:-corridas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_corridas_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-corridas}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-local_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-local_mongo_password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME:-local_admin}", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-local_mongo_password}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-local_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local_rabbit_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "15692:15692"
    entrypoint: ["bash", "-c"]
    command: ["cp /opt/rabbitmq-conf/enabled_plugins /etc/rabbitmq/enabled_plugins && exec docker-entrypoint.sh rabbitmq-server"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/opt/rabbitmq-conf/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-corridas}
      MYSQL_USER: ${MYSQL_USER:-corridas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_corridas_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_redis_password}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-local_rabbit}:${RABBITMQ_DEFAULT_PASS:-local_rabbit_password}@rabbitmq:5672
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-local_admin}:${MONGO_INITDB_ROOT_PASSWORD:-local_mongo_password}@mongodb:27017/${MONGO_INITDB_DATABASE:-corridas}?authSource=admin
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-local_rabbit}:${RABBITMQ_DEFAULT_PASS:-local_rabbit_password}@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_redis_password}
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-local_admin}:${MONGO_INITDB_ROOT_PASSWORD:-local_mongo_password}@mongodb:27017/${MONGO_INITDB_DATABASE:-corridas}?authSource=admin
      METRICS_PORT: 9101
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "9101:9101"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  rabbitmq_data:
  prometheus_data:
