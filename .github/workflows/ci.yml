name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Docker images
        run: |
          docker build -f apps/api/Dockerfile -t taxi-rio-api:ci .
          docker build -f apps/worker/Dockerfile -t taxi-rio-worker:ci .
          docker build -f apps/web/Dockerfile -t taxi-rio-web:ci .
